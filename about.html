<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>about · elise</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="music-player.css" />
  </head>
  <body>
    <flair-trail></flair-trail>
    <special-header></special-header>
    <main>
      <div class="container container--about">
        <div class="about-page">
          <header class="about-hero">
            <div class="deco-banner-wrap">
              <img src="assets/deco.svg" alt="" class="deco-banner" />
            </div>
            <div class="about-hero__title-block">
              <h1 class="about-heading" data-sanity="about-heading"></h1>
              <img
                src="assets/elise%20static.svg"
                alt="Elise"
                class="deco-elise"
              />
            </div>
          </header>

          <div class="about-body">
            <hr class="about-rule" />
            <div class="about-sections" data-sanity="about-rows"></div>
            <hr class="about-rule" />
          </div>

          <p class="about-ps" data-sanity="about-postscript"></p>

          <div class="links links--about" data-sanity="social-links"></div>
        </div>
      </div>
    </main>
    <special-footer></special-footer>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/MorphSVGPlugin.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.13.0/lottie.min.js"></script>
    <script src="headerFooterManager.js"></script>
    <script src="sanity-content.js"></script>
    <script src="music-player.js"></script>
    <script src="script.js"></script>
  </body>
</html>
