<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>commission · elise</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="music-player.css" />
  </head>
  <body>
    <flair-trail></flair-trail>
    <special-header></special-header>
    <main>
      <div class="commission-page">
        <div class="commission-title">
          <img
            src="assets/terms%20of%20service.svg"
            alt="commission"
            class="tos"
          />
          <h4 class="commission-status" data-sanity="commission-status"></h4>
          <p class="commission-queue" data-sanity="commission-queue"></p>
        </div>
        <div class="dotted-container">
          <div class="tos-section container">
            <h5
              class="tos-section-title"
              data-sanity="pricing-title"
            ></h5>
            <div class="tos-section-list" data-sanity="pricing-list"></div>
          </div>

          <div class="divider-container">
            <img src="assets/divider.svg" alt="divider" class="divider" />
          </div>

          <div class="tos-section container">
            <h5
              class="tos-section-title"
              data-sanity="payment-title"
            ></h5>
            <div class="tos-section-list" data-sanity="payment-list"></div>
          </div>
        </div>
      </div>
    </main>
    <special-footer></special-footer>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/MorphSVGPlugin.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.13.0/lottie.min.js"></script>
    <script src="headerFooterManager.js"></script>
    <script src="sanity-content.js"></script>
    <script src="music-player.js"></script>
    <script src="script.js"></script>
  </body>
</html>
